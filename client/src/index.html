<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Price Tracker Client</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="header"></header>

    <main>
        <nav id="sidebar"></nav>
        <section id="workspace"></section>
    </main>

    <div id="auth-overlay">
        <div id="auth-panel">
            <h1>Price Tracker</h1>
            <div id="auth-options">
                <div id="auth-existing" class="auth-section">
                    <h2>Existing API Key</h2>
                    <input type="email" id="auth-email-input" placeholder="Email address">
                    <input type="text" id="api-key-input" placeholder="Enter your API key">
                    <button id="auth-submit-key">Continue</button>
                </div>
                <div class="auth-divider">or</div>
                <div id="auth-create" class="auth-section">
                    <h2>Create New User</h2>
                    <input type="email" id="create-email" placeholder="Email address">
                    <button id="auth-create-user">Create & Continue</button>
                </div>
                <div class="auth-divider">or</div>
                <div id="auth-anonymous" class="auth-section">
                    <button id="auth-continue-anon">Continue as Anonymous</button>
                </div>
            </div>
        </div>
    </div>

    <div id="credentials-modal" style="display:none;">
        <div class="credentials-panel">
            <button id="cred-close" class="cred-close-btn" aria-label="Close">&times;</button>
            <h2>Your Credentials</h2>
            <p class="cred-subtitle">You can also export this later from the products page.</p>
            <div class="cred-row">
                <span class="cred-label">API Key</span>
                <div class="cred-input-wrap">
                    <input type="password" id="cred-api-key" class="cred-input" readonly>
                    <button class="cred-copy-btn" data-target="cred-api-key" aria-label="Copy API key">Copy</button>
                    <button class="cred-copy-btn" id="cred-toggle-visibility" aria-label="Toggle API key visibility">Show</button>
                </div>
            </div>
            <p class="cred-warning">Your API key cannot be retrieved from the server after you leave this page. Make sure to save it now.</p>
            <button id="cred-dismiss" class="btn btn-primary">I've Saved My Key</button>
        </div>
    </div>

    <script src="js/chart.umd.min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
