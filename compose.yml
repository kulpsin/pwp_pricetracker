services:
  app:
    build: .
    ports:
      - 127.0.0.1:${APP_PORT:?Port must be set in .env}:8000
    volumes:
      - instance-data:/opt/pricetracker/instance
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        API_BASE_URL: ${API_BASE_URL:-http://app:8000}
    ports:
      - 127.0.0.1:${CLIENT_PORT:?Client port missing}:80
    restart: unless-stopped

volumes:
  instance-data:
